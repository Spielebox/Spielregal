<title>Spielregal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@700&display=swap');

  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14263F; }

  .sr-app {
    font-family: 'Inter', sans-serif;
    background: #14263F;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    box-sizing: border-box;
  }
  .sr-phone {
    width: 100%;
    max-width: 420px;
    background: #1F3F63;
    border-radius: 34px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 8px #0A1626;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: min(860px, calc(100vh - 48px));
    position: relative;
    color: #EDF2F8;
  }
  .sr-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 22px;
    background: #0A1626;
    border-radius: 14px;
    z-index: 10;
  }
  .sr-display { font-family: 'Fraunces', serif; }
  .sr-mono { font-family: 'Space Mono', monospace; }

  .sr-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .sr-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 38px 16px 12px 16px;
    flex-shrink: 0;
  }
  .sr-topbar-shelf { position: relative; align-items: flex-start; gap: 10px; }
  .sr-topbar-titleWrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-shrink: 0; }
  .sr-versionTag { font-size: 10px; color: #7E9AC2; }
  .sr-headerIcons { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; min-width: 0; max-width: 100%; }
  .sr-headerIcons.searching { flex: 1 1 auto; min-width: 0; max-width: 100%; }
  .sr-iconbtn-sq {
    position: relative; width: 38px; height: 38px; border-radius: 10px; background: none;
    border: 1px solid #2E5480; color: #EDF2F8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .sr-iconbtn-sq.active { background: #F0B93E; border-color: #F0B93E; color: #14263F; }
  .sr-dot { position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: #FAF7F2; border: 2px solid #14263F; }
  .sr-searchbarInline {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: #14263F; border: 1.4px solid #F0B93E;
    border-radius: 999px; padding: 0 12px; height: 38px; box-sizing: border-box;
  }
  .sr-searchbarInline input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #EDF2F8; font-size: 14px; font-family: inherit; }
  .sr-searchbarInline button { flex-shrink: 0; background: none; border: none; color: #9FB7D6; cursor: pointer; display: flex; }

  .sr-sheetOverlay { position: fixed; inset: 0; background: rgba(8,14,24,0.6); display: flex; align-items: flex-end; z-index: 50; }
  .sr-sheet { width: 100%; max-height: 82vh; background: #1F3F63; border-radius: 20px 20px 0 0; padding: 10px 18px 20px; display: flex; flex-direction: column; overflow-y: auto; box-sizing: border-box; }
  .sr-sheetHandle { position: relative; width: 40px; height: 4px; border-radius: 2px; background: #2E5480; margin: 4px auto 12px; }
  .sr-sheetHandle::before { content: ''; position: absolute; top: -16px; left: -60px; right: -60px; bottom: -16px; }
  .sr-sheetTabs { display: flex; background: #14263F; border-radius: 10px; padding: 3px; margin-bottom: 4px; }
  .sr-sheetTab { flex: 1; background: none; border: none; color: #9FB7D6; font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 0; border-radius: 8px; cursor: pointer; }
  .sr-sheetTab.active { background: #234B78; color: #F0B93E; }
  .sr-sheetBody { display: flex; flex-direction: column; gap: 12px; margin: 10px 0 16px; }
  .sr-filterChip2 { font-size: 12px; color: #9FB7D6; border: 1px solid #2E5480; background: none; border-radius: 999px; padding: 6px 12px; font-family: inherit; cursor: pointer; }
  .sr-filterChip2.active { background: #F0B93E; border-color: #F0B93E; color: #14263F; }

  .sr-sortRow { display: flex; align-items: center; gap: 8px; background: #234B78; border: 1.3px solid #2E5480; border-radius: 12px; padding: 10px 12px; }
  .sr-sortRow.active { background: #3A331A; border-color: #F0B93E; }
  .sr-sortLabel { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #EDF2F8; }
  .sr-sortRow.active .sr-sortLabel { color: #F0B93E; }
  .sr-sortSeg { width: 46px; background: #14263F; border: 1px solid #2E5480; color: #9FB7D6; border-radius: 999px; padding: 5px 0; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .sr-sortRow.active .sr-sortSeg { background: #F0B93E; border-color: #F0B93E; color: #14263F; }
  .sr-sortArrow { width: 26px; height: 26px; background: #14263F; border: none; border-radius: 7px; color: #EDF2F8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .sr-sortArrow:disabled { color: #3E5A80; cursor: not-allowed; }

/* ---------- Hilfsfunktionen ---------- */

function uid() { return 'g_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function avgRating(ratings) {
  if (!ratings || ratings.length === 0) return null;
  var sum = ratings.reduce(function (s, r) { return s + Number(r.score); }, 0);
  return Math.round((sum / ratings.length) * 10) / 10;
}

/* ---------- BGG XML API (nur fürs Suchen, braucht Internet) ---------- */
/* BGG sendet keine CORS-Freigabe-Header, daher versuchen wir zuerst direkt
   und weichen bei Fehlschlag auf kostenlose CORS-Proxys aus. */

var CORS_WRAPPERS = [
  function (u) { return 'https://spielregal-proxy.spam-lama.workers.dev/?url=' + encodeURIComponent(u); },
  function (u) { return u; },
  function (u) { return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u); },
  function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function (u) { return 'https://thingproxy.freeboard.io/fetch/' + u; },
];

function fetchWithCorsFallback(url) {
  var attempts = CORS_WRAPPERS.map(function (w) { return w(url); });
  var log = [];

  function tryIndex(i) {
    if (i >= attempts.length) {
      var err = new Error(log.join(' | '));
      return Promise.reject(err);
    }
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, 9000);
    return fetch(attempts[i], { signal: controller.signal })
      .then(function (res) {
        clearTimeout(timeoutId);
        if (!res.ok) { log.push('Versuch ' + (i + 1) + ': HTTP ' + res.status); throw new Error('bad-status'); }
        return res;
      })
      .catch(function (err) {
        clearTimeout(timeoutId);
        if (log.length <= i) {
          var reason = (err && err.name === 'AbortError') ? 'Zeitüberschreitung' : (err && err.message) ? err.message : 'Fehler';
          log.push('Versuch ' + (i + 1) + ': ' + reason);
        }
        return tryIndex(i + 1);
      });
  }
  return tryIndex(0);
}

function bggSearch(query) {
  return fetchWithCorsFallback('https://boardgamegeek.com/xmlapi2/search?query=' + encodeURIComponent(query) + '&type=boardgame')
    .then(function (res) { return res.text(); })
    .then(function (text) {
      var doc = new DOMParser().parseFromString(text, 'text/xml');
      if (doc.querySelector('parsererror')) throw new Error('parse: ' + text.slice(0, 150).replace(/\s+/g, ' '));
      var items = Array.from(doc.getElementsByTagName('item'));
      return items.slice(0, 15).map(function (it) {
        var nameEl = it.querySelector('name[type="primary"]') || it.querySelector('name');
        var yearEl = it.querySelector('yearpublished');
        return { id: it.getAttribute('id'), title: nameEl ? nameEl.getAttribute('value') : 'Unbekannt', year: yearEl ? yearEl.getAttribute('value') : null };
      });
    });
}

function bggThing(id) {
  return fetchWithCorsFallback('https://boardgamegeek.com/xmlapi2/thing?id=' + id + '&stats=1')
    .then(function (res) { return res.text(); })
    .then(function (text) {
      var doc = new DOMParser().parseFromString(text, 'text/xml');
      if (doc.querySelector('parsererror')) throw new Error('parse: ' + text.slice(0, 150).replace(/\s+/g, ' '));
      var item = doc.querySelector('item');
      if (!item) throw new Error('notfound');
      var nameEl = item.querySelector('name[type="primary"]') || item.querySelector('name');
      var publisherEl = item.querySelector('link[type="boardgamepublisher"]');
      var categoryEl = item.querySelector('link[type="boardgamecategory"]');
      var image = item.querySelector('image');
      var get = function (sel) { var el = item.querySelector(sel); return el ? el.getAttribute('value') : ''; };

      var optimalPlayers = '';
      var poll = Array.from(item.querySelectorAll('poll')).find(function (pl) { return pl.getAttribute('name') === 'suggested_numplayers'; });
      if (poll && Number(poll.getAttribute('totalvotes')) > 0) {
        var bestCount = null, bestVotes = -1;
        Array.from(poll.querySelectorAll('results')).forEach(function (res2) {
          var numplayers = res2.getAttribute('numplayers');
          if (!/^\d+$/.test(numplayers)) return;
          var bestResult = Array.from(res2.querySelectorAll('result')).find(function (r) { return r.getAttribute('value') === 'Best'; });
          var votes = bestResult ? Number(bestResult.getAttribute('numvotes')) : 0;
          if (votes > bestVotes) { bestVotes = votes; bestCount = numplayers; }
        });
        if (bestVotes > 0) optimalPlayers = bestCount;
      }

      var descEl = item.querySelector('description');
      var description = descEl ? descEl.textContent
        .replace(/&#10;/g, '\n').replace(/&mdash;/g, '\u2014').replace(/&ndash;/g, '\u2013')
        .replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&rsquo;/g, '\u2019')
        .trim() : '';

      var authorLinks = Array.from(item.querySelectorAll('link[type="boardgamedesigner"]')).map(function (l) { return l.getAttribute('value'); });
      var artistLinks = Array.from(item.querySelectorAll('link[type="boardgameartist"]')).map(function (l) { return l.getAttribute('value'); });

      var avgEl = item.querySelector('statistics ratings average');
      var bggRating = null;
      if (avgEl) {
        var avgVal = Number(avgEl.getAttribute('value'));
        if (avgVal > 0) bggRating = Math.round(avgVal * 10) / 10;
      }

      return {
        title: nameEl ? nameEl.getAttribute('value') : '', year: get('yearpublished'),
        minPlayers: get('minplayers'), maxPlayers: get('maxplayers'), optimalPlayers: optimalPlayers,
        duration: get('playingtime'), publisher: publisherEl ? publisherEl.getAttribute('value') : '',
        category: categoryEl ? categoryEl.getAttribute('value') : '', imageUrl: image ? image.textContent : '', bggId: id,
        age: get('minage'), description: description,
        author: authorLinks.join(', '), illustrator: artistLinks.join(', '), bggRating: bggRating,
      };
    });
}

function mapBggCategory(bggCategory) {
  if (!bggCategory) return 'Sonstiges';
  var c = bggCategory.toLowerCase();
  if (c.indexOf('party') !== -1) return 'Partyspiel';
  if (c.indexOf('card game') !== -1) return 'Kartenspiel';
  if (c.indexOf('children') !== -1 || c.indexOf('kids') !== -1) return 'Kinderspiel';
  if (c.indexOf('cooperative') !== -1 || c.indexOf('co-op') !== -1) return 'Kooperativ';
  if (c.indexOf('dice') !== -1) return 'W\u00fcrfelspiel';
  if (c.indexOf('deduction') !== -1 || c.indexOf('trivia') !== -1 || c.indexOf('quiz') !== -1) return 'Ratespiel';
  if (c.indexOf('dexterity') !== -1) return 'Geschicklichkeit';
  if (c.indexOf('word game') !== -1) return 'Wortspiel';
  if (c.indexOf('strategy') !== -1 || c.indexOf('wargame') !== -1 || c.indexOf('economic') !== -1) return 'Strategiespiel';
  return 'Sonstiges';
}

function persist(next) {
  games = next;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(games)); } catch (e) { console.error('Speichern fehlgeschlagen', e); }
}
function addGame(g) { persist(games.concat([g])); }
function updateGameInList(g) { persist(games.map(function (x) { return x.id === g.id ? g : x; })); }
function deleteGameFromList(id) { persist(games.filter(function (x) { return x.id !== id; })); }

var shelves = [];
function loadShelves() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY_SHELVES);
    if (raw) shelves = JSON.parse(raw);
  } catch (e) { console.error('Konnte Regale nicht lesen', e); }
}
function persistShelves(next) {
  shelves = next;
  try { localStorage.setItem(STORAGE_KEY_SHELVES, JSON.stringify(shelves)); } catch (e) { console.error('Speichern der Regale fehlgeschlagen', e); }
}
function addShelf(name) { persistShelves(shelves.concat([{ id: uid(), name: name }])); }
function deleteShelf(id) {
  persistShelves(shelves.filter(function (s) { return s.id !== id; }));
  games.forEach(function (g) {
    if ((g.lists || []).indexOf(id) !== -1) {
      g.lists = g.lists.filter(function (x) { return x !== id; });
    }
  });
  persist(games.slice());
}
function gamesInRegal(regalId) {
  if (regalId === 'favoriten') return games.filter(function (g) { return g.favorite; });
  if (regalId === 'wunschliste') return games.filter(function (g) { return g.status === 'wunschliste'; });
  return games.filter(function (g) { return (g.lists || []).indexOf(regalId) !== -1; });
}
function toggleGameInRegal(gameId, regalId) {
  var g = games.find(function (x) { return x.id === gameId; });
  if (!g) return;
  if (regalId === 'favoriten') { g.favorite = !g.favorite; }
  else {
    var lists = (g.lists || []).slice();
    var idx = lists.indexOf(regalId);
    if (idx === -1) lists.push(regalId); else lists.splice(idx, 1);
    g.lists = lists;
  }
  updateGameInList(g);
}

var formFaecherPicker = [];
var formFaecherNewName = '';

function mountFaecherPickerOverlay(hostContainer, onDone) {
  var overlay = document.createElement('div');
  overlay.className = 'sr-pickerOverlay';
  document.body.appendChild(overlay);

  function render() {
    var rows = shelves.map(function (s) {
      var checked = formFaecherPicker.indexOf(s.id) !== -1;
      return '<div class="sr-regalRow" data-pick-fach="' + s.id + '">' + iconSvg('emptyShelf', 18) +
        '<div class="sr-regalRowText"><strong>' + escapeHtml(s.name) + '</strong></div>' +
        '<div class="sr-pickCheckbox' + (checked ? ' checked' : '') + '">' + (checked ? iconSvg('check', 14) : '') + '</div>' +
      '</div>';
    }).join('');

    overlay.innerHTML =
      '<div class="sr-screen">' +
        '<div class="sr-topbar"><button class="sr-iconbtn" id="pickerBack">' + iconSvg('chevronLeft', 20) + '</button><span class="sr-topbar-title2">F\u00e4cher zuordnen</span><span style="width:36px"></span></div>' +
        '<div class="sr-scroll">' +
          rows +
          '<div class="sr-newRegalRow" style="margin-top:20px">' +
            '<input class="sr-input" id="pickerNewInput" placeholder="Name des neuen Fachs" value="' + escapeHtml(formFaecherNewName) + '" />' +
            '<button class="sr-iconbtn" id="pickerNewAdd">' + iconSvg('plus', 18) + '</button>' +
          '</div>' +
          '<button class="sr-btn-primary sr-fullwidth" id="pickerDone" style="margin-top:20px">Fertig</button>' +
        '</div>' +
      '</div>';

    overlay.querySelector('#pickerBack').addEventListener('click', finish);
    overlay.querySelector('#pickerDone').addEventListener('click', finish);
    Array.from(overlay.querySelectorAll('[data-pick-fach]')).forEach(function (row) {
      row.addEventListener('click', function () {
        var id = row.getAttribute('data-pick-fach');
        var idx = formFaecherPicker.indexOf(id);
        if (idx === -1) formFaecherPicker.push(id); else formFaecherPicker.splice(idx, 1);
        render();
      });
    });
    overlay.querySelector('#pickerNewInput').addEventListener('input', function (e) { formFaecherNewName = e.target.value; });
    overlay.querySelector('#pickerNewAdd').addEventListener('click', function () {
      var name = formFaecherNewName.trim();
      if (!name) return;
      var newShelf = { id: uid(), name: name };
      persistShelves(shelves.concat([newShelf]));
      formFaecherPicker.push(newShelf.id);
      formFaecherNewName = '';
      render();
    });
  }

  function finish() {
    overlay.remove();
    onDone(formFaecherPicker.slice());
  }

  render();

function makeDefaultSort() {
  return [
    { key: 'title', label: 'Titel', type: 'text', active: true, dir: 'asc', defaultDir: 'asc' },
    { key: 'rating', label: 'Bewertung', type: 'num', active: false, dir: 'desc', defaultDir: 'desc' },
    { key: 'publisher', label: 'Verlag', type: 'text', active: false, dir: 'asc', defaultDir: 'asc' },
    { key: 'minPlayers', label: 'min', type: 'num', active: false, dir: 'asc', defaultDir: 'asc', icon: 'users' },
    { key: 'maxPlayers', label: 'max', type: 'num', active: false, dir: 'asc', defaultDir: 'asc', icon: 'users' },
    { key: 'duration', label: 'Dauer', type: 'num', active: false, dir: 'asc', defaultDir: 'asc' },
    { key: 'age', label: 'Alter', type: 'num', active: false, dir: 'asc', defaultDir: 'asc' },
    { key: 'lastPlayed', label: 'Zuletzt gespielt', type: 'num', active: false, dir: 'asc', defaultDir: 'asc' },
  ];
}

function makeFilterCtx() {
  return { cats: [], minPlayers: 0, minRating: 0, ageFrom: 0, maxDuration: 0, publisher: '', sort: makeDefaultSort(), open: false, tab: 'filter' };
}

var shelfQuery = '';
var shelfSearchOpen = false;
var shelfFilterCtx = makeFilterCtx();
var regalFilterCtx = makeFilterCtx();

function shelfFilterActive(ctx) {
  return ctx.cats.length > 0 || ctx.minPlayers > 0 || ctx.minRating > 0 || ctx.ageFrom > 0 || ctx.maxDuration > 0 || !!ctx.publisher;
}
function shelfSortActive(ctx) {
  return ctx.sort.some(function (s) { return s.key !== 'title' && s.active; }) ||
    ctx.sort.some(function (s) { return s.key === 'title' && s.dir !== s.defaultDir; });
}
function sortValue(g, key) {
  if (key === 'rating') { var avg = avgRating(g.ratings); return avg != null ? avg : g.bggRating; }
  if (key === 'title' || key === 'publisher') return (g[key] || '').toLowerCase();
  if (key === 'lastPlayed') return g.lastPlayed ? new Date(g.lastPlayed).getTime() : -1;
  return Number(g[key]) || null;
}
function applyShelfSort(list, ctx) {
  var active = ctx.sort.filter(function (s) { return s.active; });
  return list.slice().sort(function (a, b) {
    for (var i = 0; i < active.length; i++) {
      var s = active[i];
      var va = sortValue(a, s.key), vb = sortValue(b, s.key);
      var aEmpty = va == null || va === '', bEmpty = vb == null || vb === '';
      if (aEmpty && bEmpty) continue;
      if (aEmpty) return 1;
      if (bEmpty) return -1;
      var cmp = va < vb ? -1 : va > vb ? 1 : 0;
      if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;
    }
    return 0;
  });
}

function mountExportScreen(container) {
  container.innerHTML =
    '<div class="sr-screen">' +
      topbarBackHtml('Exportieren') +

        '<div class="sr-statBox">' +

        '</div>' +
        '<p class="sr-formHint">Die Datei enth\u00e4lt alle Angaben aus deinem Regal im lesbaren JSON-Format. Du kannst sie anschlie\u00dfend in den Dateien, per AirDrop oder in der Cloud sichern.</p>' +
        '<button class="sr-btn-primary sr-fullwidth" id="exportBtn">' + iconSvg('upload', 16) + ' Datei exportieren</button>' +
        '<p class="sr-formHint" style="margin-top:14px">\u00d6ffnet das Teilen-Men\u00fc von iOS</p>' +
        '<p class="sr-formHint" style="display:flex;gap:8px;align-items:flex-start">' + iconSvg('info', 14) + '<span>Alles bleibt lokal auf deinem Ger\u00e4t \u2013 au\u00dfer du w\u00e4hlst beim Teilen bewusst einen Cloud-Speicherort.</span></p>' +
      '</div>' +
    '</div>';

  container.querySelector('#regalBack').addEventListener('click', function () { settingsView = 'main'; renderApp(); });
  container.querySelector('#exportBtn').addEventListener('click', function () {
    var payload = { exportedAt: new Date().toISOString(), games: games, shelves: shelves };
    var json = JSON.stringify(payload, null, 2);
    var fileName = 'spielregal-export-' + new Date().toISOString().slice(0, 10) + '.json';
    var file = new File([json], fileName, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Spielregal-Export' }).then(function () {
          try { localStorage.setItem('spielregal_last_export', new Date().toISOString()); } catch (e) {}
        }).catch(function () {});
      } else {
        var url = URL.createObjectURL(file);
        var a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        try { localStorage.setItem('spielregal_last_export', new Date().toISOString()); } catch (e) {}
      }
    } catch (e) { console.error('Export fehlgeschlagen', e); }
  });
}

    container.querySelector('#regalBack').addEventListener('click', function () { settingsView = 'main'; renderApp(); });
    var fileInput = container.querySelector('#importFileInput');
    container.querySelector('#importPickBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          var incoming = Array.isArray(data) ? data : (data.games || []);
          importPreview = incoming.filter(function (g) { return g && g.title; });
          importConflicts = importPreview.filter(function (g) {
            var existing = games.find(function (x) { return x.title.toLowerCase() === g.title.toLowerCase(); });
            return existing && existing.ratings && existing.ratings.length > 0 && g.ratings && g.ratings.length > 0;
          });
          mountImportScreen(container);
        } catch (err) {
          alert('Diese Datei konnte nicht gelesen werden.');
        }
      };
      reader.readAsText(file);
    });
    return;
  }

  var newCount = importPreview.filter(function (g) { return !games.some(function (x) { return x.title.toLowerCase() === g.title.toLowerCase(); }); }).length;

  container.innerHTML =
    '<div class="sr-screen">' +
      topbarBackHtml('Importieren') +
      '<div class="sr-scroll">' +
        '<div class="sr-sectionTitle">GEFUNDEN</div>' +
        '<div class="sr-regalRow"><div class="sr-regalRowText"><strong>' + importPreview.length + ' Spiele in der Datei</strong>' +
          '<span>' + newCount + ' neu \u00b7 ' + (importPreview.length - newCount) + ' bereits vorhanden (werden \u00fcbersprungen)</span></div></div>' +
        (importConflicts.length > 0 ?
          '<div class="sr-dupWarning" style="display:block"><div class="sr-dupBox">' + iconSvg('warning', 20) +
            '<div><strong>Bewertungen in ' + importConflicts.length + ' Spiel' + (importConflicts.length === 1 ? '' : 'en') + ' bereits vorhanden</strong>' +
            '<p>Wie soll mit den eigenen Bewertungen bei diesen Spielen umgegangen werden?</p>' +
            '<div class="sr-segmented" id="importModeToggle" style="margin-top:6px">' +
              '<button type="button" class="sr-seg-btn' + (importMode === 'merge' ? ' active' : '') + '" data-import-mode="merge">Erg\u00e4nzen</button>' +
              '<button type="button" class="sr-seg-btn' + (importMode === 'overwrite' ? ' active' : '') + '" data-import-mode="overwrite">\u00dcberschreiben</button>' +
            '</div></div></div>' : '') +
        '<button class="sr-btn-primary sr-fullwidth" id="importConfirmBtn" style="margin-top:20px">Import best\u00e4tigen</button>' +
        '<button class="sr-btn-ghost sr-fullwidth" id="importCancelBtn" style="margin-top:10px">Abbrechen</button>' +
      '</div>' +
    '</div>';

  container.querySelector('#regalBack').addEventListener('click', function () { importPreview = null; settingsView = 'main'; renderApp(); });
  container.querySelector('#importCancelBtn').addEventListener('click', function () { importPreview = null; mountImportScreen(container); });
  var modeToggle = container.querySelector('#importModeToggle');
  if (modeToggle) {
    modeToggle.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-import-mode]');
      if (!btn) return;
      importMode = btn.getAttribute('data-import-mode');
      mountImportScreen(container);
    });
  }
  container.querySelector('#importConfirmBtn').addEventListener('click', function () {
    var updated = games.slice();
    importPreview.forEach(function (incoming) {
      var idx = updated.findIndex(function (x) { return x.title.toLowerCase() === incoming.title.toLowerCase(); });
      if (idx === -1) {
        updated.push(Object.assign(blankGame(), incoming, { id: uid() }));
      } else {
        var existing = updated[idx];
        if (incoming.ratings && incoming.ratings.length > 0) {
          if (importMode === 'overwrite') {
            existing = Object.assign({}, existing, { ratings: incoming.ratings });
          } else {
            var names = existing.ratings.map(function (r) { return r.name.toLowerCase(); });
            var merged = existing.ratings.concat(incoming.ratings.filter(function (r) { return names.indexOf(r.name.toLowerCase()) === -1; }));
            existing = Object.assign({}, existing, { ratings: merged });
          }
          updated[idx] = existing;
        }
      }
    });
    persist(updated);
    importPreview = null;
    settingsView = 'main';
    renderApp();
  });
}

function mountStatsScreen(container) {
  var total = games.length;
  var ratingsAvg = (function () {
    var vals = games.map(function (g) { var a = avgRating(g.ratings); return a != null ? a : g.bggRating; }).filter(function (v) { return v != null; });
    if (vals.length === 0) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  })();
  var favCount = games.filter(function (g) { return g.favorite; }).length;

  var catCounts = {};
  games.forEach(function (g) { catCounts[g.category] = (catCounts[g.category] || 0) + 1; });
  var maxCat = Math.max(1, Math.max.apply(null, CATEGORIES.map(function (c) { return catCounts[c] || 0; })));

  var bestGame = games.slice().sort(function (a, b) {
    var va = avgRating(a.ratings); va = va != null ? va : a.bggRating;
    var vb = avgRating(b.ratings); vb = vb != null ? vb : b.bggRating;
    return (vb || -1) - (va || -1);
  })[0];

  var longestUnplayed = games.filter(function (g) { return g.status !== 'wunschliste'; }).slice().sort(function (a, b) {
    var ta = a.lastPlayed ? new Date(a.lastPlayed).getTime() : -1;
    var tb = b.lastPlayed ? new Date(b.lastPlayed).getTime() : -1;
    return ta - tb;
  })[0];

  function barRow(label, count, max) {
    var pct = Math.max(4, Math.round((count / max) * 100));
    return '<div class="sr-statBarRow"><div class="sr-statBarLabel"><span>' + escapeHtml(label) + '</span><span class="sr-mono">' + count + '</span></div>' +
      '<div class="sr-statBarTrack"><div class="sr-statBarFill" style="width:' + pct + '%"></div></div></div>';
  }

  var catHtml = CATEGORIES.map(function (c) { return barRow(c, catCounts[c] || 0, maxCat); }).join('');

  container.innerHTML =
    '<div class="sr-screen">' +
      topbarBackHtml('Statistik') +
      '<div class="sr-scroll">' +
        '<div class="sr-row-3">' +
          '<div class="sr-statTile"><div class="sr-statNum">' + total + '</div><div class="sr-statLbl">Spiele</div></div>' +
          '<div class="sr-statTile"><div class="sr-statNum">' + (ratingsAvg != null ? ratingsAvg.toFixed(1) : '\u2013') + '</div><div class="sr-statLbl">\u00d8 Bewertung</div></div>' +
          '<div class="sr-statTile"><div class="sr-statNum">' + favCount + '</div><div class="sr-statLbl">Favoriten</div></div>' +
        '</div>' +
        '<div class="sr-sectionTitle" style="margin-top:20px">KATEGORIEN</div>' +
        catHtml +
        '<div class="sr-sectionTitle" style="margin-top:20px">HIGHLIGHTS</div>' +
        (bestGame ? '<div class="sr-regalRow" data-open-game-stat="' + bestGame.id + '">' + iconSvg('star', 18) + '<div class="sr-regalRowText"><strong>' + escapeHtml(bestGame.title) + '</strong><span>Bestbewertetes Spiel</span></div></div>' : '') +
        (longestUnplayed ? '<div class="sr-regalRow" data-open-game-stat="' + longestUnplayed.id + '">' + iconSvg('calendar', 18) + '<div class="sr-regalRowText"><strong>' + escapeHtml(longestUnplayed.title) + '</strong><span>' + (longestUnplayed.lastPlayed ? 'Am l\u00e4ngsten nicht gespielt' : 'Noch nie gespielt') + '</span></div></div>' : '') +
      '</div>' +
    '</div>';

  container.querySelector('#regalBack').addEventListener('click', function () { settingsView = 'main'; renderApp(); });
  Array.from(container.querySelectorAll('[data-open-game-stat]')).forEach(function (row) {
    row.addEventListener('click', function () { settingsView = null; selectedId = row.getAttribute('data-open-game-stat'); renderApp(); });
  });
}

        rows +

          '<button class="sr-iconbtn" id="regalNewAdd">' + iconSvg('plus', 18) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  container.querySelector('#regalBack').addEventListener('click', function () { regalView = null; renderApp(); });

  var openSwipeId = null;
  Array.from(container.querySelectorAll('.sr-swipeRow')).forEach(function (row) {
    var id = row.getAttribute('data-shelf-id');
    var content = row.querySelector('.sr-swipeContent');
    var startX = null, baseOffset = 0, curOffset = 0;
    content.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
      baseOffset = (openSwipeId === id) ? -76 : 0;
      content.style.transition = 'none';
    }, { passive: true });
    content.addEventListener('touchmove', function (e) {
      if (startX == null) return;
      var dx = e.touches[0].clientX - startX;
      curOffset = Math.max(-76, Math.min(0, baseOffset + dx));
      content.style.transform = 'translateX(' + curOffset + 'px)';
    }, { passive: true });
    content.addEventListener('touchend', function () {
      if (startX == null) return;
      content.style.transition = 'transform 0.18s ease';
      if (curOffset < -38) { content.style.transform = 'translateX(-76px)'; openSwipeId = id; }
      else { content.style.transform = 'translateX(0)'; if (openSwipeId === id) openSwipeId = null; }
      startX = null;
    });
    content.addEventListener('click', function (e) {
      if (openSwipeId === id) { content.style.transition = 'transform 0.18s ease'; content.style.transform = 'translateX(0)'; openSwipeId = null; return; }

    });
  });
  Array.from(container.querySelectorAll('[data-delete-shelf]')).forEach(function (btn) {
    btn.addEventListener('click', function () {
      deleteShelf(btn.getAttribute('data-delete-shelf'));
      mountRegalManageScreen(container);

  container.querySelector('[data-open-regal="favoriten"]').addEventListener('click', function () { regalView = { mode: 'detail', id: 'favoriten', returnTo: { type: 'manage' } }; renderApp(); });
  container.querySelector('[data-open-regal="wunschliste"]').addEventListener('click', function () { regalView = { mode: 'detail', id: 'wunschliste', returnTo: { type: 'manage' } }; renderApp(); });

  container.querySelector('#regalNewInput').addEventListener('input', function (e) { regalNewName = e.target.value; });
  container.querySelector('#regalNewAdd').addEventListener('click', function () {
    var name = regalNewName.trim();
    if (!name) return;
    addShelf(name);
    regalNewName = '';
    mountRegalManageScreen(container);
  });
}

}

function applyShelfFilters(list, ctx, excludeWishlist) {
  if (excludeWishlist == null) excludeWishlist = true;
  return list.filter(function (g) {
    if (excludeWishlist && g.status === 'wunschliste') return false;
    var matchesCat = ctx.cats.length === 0 || ctx.cats.indexOf(g.category) !== -1;
    var min = Number(g.minPlayers) || 1, max = Number(g.maxPlayers) || 99;
    var matchesPlayers = ctx.minPlayers === 0 || (ctx.minPlayers === 13 ? max >= 13 : (ctx.minPlayers >= min && ctx.minPlayers <= max));
    var avg = avgRating(g.ratings);
    var matchesRating = ctx.minRating === 0 || (avg != null && avg >= ctx.minRating);
    var matchesAge = ctx.ageFrom === 0 || (Number(g.age) && Number(g.age) >= ctx.ageFrom);
    var dur = parseDurationValue(g.duration);
    var matchesDuration = ctx.maxDuration === 0 || (dur != null && dur <= ctx.maxDuration);
    var matchesPublisher = !ctx.publisher || g.publisher === ctx.publisher;
    return matchesCat && matchesPlayers && matchesRating && matchesAge && matchesDuration && matchesPublisher;
  });
}

function wireShelfFilterSheet(container, remountFn, ctx) {
  container.querySelector('#shelfSheetOverlay').addEventListener('click', function (e) {
    if (e.target.id === 'shelfSheetOverlay') { ctx.open = false; remountFn(container); }
  });

  var sheetEl = container.querySelector('.sr-sheet');
  var startY = null, currentDy = 0;
  sheetEl.addEventListener('touchstart', function (e) {
    if (!e.target.closest('.sr-sheetHandle')) { startY = null; return; }
    startY = e.touches[0].clientY;
    sheetEl.style.transition = 'none';
  }, { passive: true });
  sheetEl.addEventListener('touchmove', function (e) {
    if (startY == null) return;
    currentDy = Math.max(0, e.touches[0].clientY - startY);
    sheetEl.style.transform = 'translateY(' + currentDy + 'px)';
  }, { passive: true });
  sheetEl.addEventListener('touchend', function () {
    if (startY == null) return;
    sheetEl.style.transition = 'transform 0.2s ease';
    if (currentDy > 70) {
      sheetEl.style.transform = 'translateY(100%)';
      ctx.open = false;
      setTimeout(function () { remountFn(container); }, 180);
    } else {
      sheetEl.style.transform = 'translateY(0)';
    }
    startY = null; currentDy = 0;
  });

  container.querySelector('#tabFilter').addEventListener('click', function () { ctx.tab = 'filter'; remountFn(container); });
  container.querySelector('#tabSort').addEventListener('click', function () { ctx.tab = 'sort'; remountFn(container); });
  container.querySelector('#shelfResetBtn').addEventListener('click', function () {
    if (ctx.tab === 'filter') {
      ctx.cats = []; ctx.minPlayers = 0; ctx.minRating = 0; ctx.ageFrom = 0; ctx.maxDuration = 0; ctx.publisher = '';
    } else {
      ctx.sort.forEach(function (s) { s.active = (s.key === 'title'); s.dir = s.defaultDir; });
    }
    remountFn(container);
  });
  container.querySelector('#shelfApplyBtn').addEventListener('click', function () { ctx.open = false; remountFn(container); });

  if (ctx.tab === 'filter') {
    Array.from(container.querySelectorAll('[data-cat]')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var c = btn.getAttribute('data-cat');
        var idx = ctx.cats.indexOf(c);
        if (idx === -1) ctx.cats.push(c); else ctx.cats.splice(idx, 1);
        remountFn(container);
      });
    });
    container.querySelector('#shelfSelPlayers').addEventListener('change', function (e) { ctx.minPlayers = Number(e.target.value); remountFn(container); });
    container.querySelector('#shelfSelRating').addEventListener('change', function (e) { ctx.minRating = Number(e.target.value); remountFn(container); });
    container.querySelector('#shelfSelAge').addEventListener('change', function (e) { ctx.ageFrom = Number(e.target.value); remountFn(container); });
    container.querySelector('#shelfSelDur').addEventListener('change', function (e) { ctx.maxDuration = Number(e.target.value); remountFn(container); });
    container.querySelector('#shelfSelPublisher').addEventListener('change', function (e) { ctx.publisher = e.target.value; remountFn(container); });
  } else {
    Array.from(container.querySelectorAll('[data-seg-idx]')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.getAttribute('data-seg-idx'));
        var s = ctx.sort[i];
        var isTitle = s.key === 'title';
        if (!s.active) { s.active = true; s.dir = s.defaultDir; }
        else if (s.dir === s.defaultDir) { s.dir = (s.defaultDir === 'asc' ? 'desc' : 'asc'); }
        else if (isTitle) { s.dir = s.defaultDir; }
        else { s.active = false; s.dir = s.defaultDir; }
        remountFn(container);
      });
    });
    var gripEls = Array.from(container.querySelectorAll('[data-grip-idx]'));
    if (gripEls.length > 0) {
      var rowGap = 8;
      var rowH = gripEls[0].closest('.sr-sortRow').offsetHeight + rowGap;
      var anyDragging = false;
      var sheetElOuter = container.querySelector('.sr-sheet');
      if (sheetElOuter) {
        sheetElOuter.addEventListener('touchmove', function (e) { if (anyDragging) e.preventDefault(); }, { passive: false });
      }
      gripEls.forEach(function (grip) {
        var startIdx = Number(grip.getAttribute('data-grip-idx'));
        var rowEl = grip.closest('.sr-sortRow');
        var startY = null, order = startIdx, dragging = false;
        var allRows = Array.from(container.querySelectorAll('.sr-sortRow'));

        var sheetEl = container.querySelector('.sr-sheet');
        var lockedScrollTop = 0;
        var rafId = null;

        function lockLoop() {
          if (sheetEl) sheetEl.scrollTop = lockedScrollTop;
          if (dragging) rafId = requestAnimationFrame(lockLoop);
        }

        grip.addEventListener('touchstart', function (e) {
          startY = e.touches[0].clientY;
          order = startIdx;
          dragging = true;
          anyDragging = true;
          rowEl.classList.add('dragging');
          rowEl.style.position = 'relative';
          rowEl.style.zIndex = '10';
          rowEl.style.transition = 'none';
          if (sheetEl) {
            lockedScrollTop = sheetEl.scrollTop;
            sheetEl.style.overflowY = 'hidden';
            sheetEl.style.height = sheetEl.clientHeight + 'px';
          }
          rafId = requestAnimationFrame(lockLoop);
        }, { passive: false });

        grip.addEventListener('touchmove', function (e) {
          if (!dragging) return;
          e.preventDefault();
          if (sheetEl) sheetEl.scrollTop = lockedScrollTop;
          var dy = e.touches[0].clientY - startY;
          rowEl.style.transform = 'translateY(' + dy + 'px)';
          var newOrder = Math.max(0, Math.min(allRows.length - 1, startIdx + Math.round(dy / rowH)));
          if (newOrder !== order) {
            allRows.forEach(function (other, j) {
              if (other === rowEl) return;
              if (newOrder > startIdx && j > startIdx && j <= newOrder) { other.style.transition = 'transform 0.12s ease'; other.style.transform = 'translateY(-' + rowH + 'px)'; }
              else if (newOrder < startIdx && j < startIdx && j >= newOrder) { other.style.transition = 'transform 0.12s ease'; other.style.transform = 'translateY(' + rowH + 'px)'; }
              else { other.style.transition = 'transform 0.12s ease'; other.style.transform = ''; }
            });
            order = newOrder;
          }
        }, { passive: false });

        grip.addEventListener('touchend', function () {
          if (!dragging) return;
          dragging = false;
          anyDragging = false;
          if (rafId) cancelAnimationFrame(rafId);
          if (sheetEl) { sheetEl.style.overflowY = ''; sheetEl.style.height = ''; }
          if (order !== startIdx) {
            var item = ctx.sort.splice(startIdx, 1)[0];
            ctx.sort.splice(order, 0, item);
          }
          remountFn(container);
        });
      });
    }
  }
}

}

function runAddSearch(container) {
  if (!addQuery.trim()) return;
  addLoading = true; addError = ''; addResults = [];
  mountAddScreen(container);
  bggSearch(addQuery.trim()).then(function (r) {
    addResults = r;
    if (r.length === 0) addError = 'Keine Treffer bei BoardGameGeek. Du kannst das Spiel manuell anlegen.';
  }).catch(function (err) {
    addError = 'BoardGameGeek nicht erreichbar. Diagnose: ' + (err && err.message ? err.message : 'unbekannter Fehler') + '. Du kannst das Spiel manuell anlegen.';
  }).finally(function () {
    addLoading = false;
    mountAddScreen(container);
  });
}

function pickAddResult(container, id) {
  addLoading = true; addError = '';
  mountAddScreen(container);
  bggThing(id).then(function (details) {
    addPrefill = Object.assign(blankGame(), {
      title: details.title, year: details.year, minPlayers: details.minPlayers, maxPlayers: details.maxPlayers,
      optimalPlayers: details.optimalPlayers, duration: details.duration, publisher: details.publisher,
      category: mapBggCategory(details.category), imageUrl: details.imageUrl, bggId: details.bggId,
      age: details.age, description: details.description, author: details.author,
      illustrator: details.illustrator, bggRating: details.bggRating,
    });
    addMode = 'form';
  }).catch(function (err) {
    addError = 'Details konnten nicht geladen werden. Diagnose: ' + (err && err.message ? err.message : 'unbekannter Fehler') + '. Du kannst das Spiel manuell anlegen.';
  }).finally(function () {
    addLoading = false;
    mountAddScreen(container);
  });
}

var todayPlayers = 0;
var todayMinRating = 0;
var todayPicked = null;
var todayFiltersOpen = false;
var todayOnlyOptimal = false;
var todayYearFrom = 0;
var todayMaxDuration = 0;
var todayAgeFrom = 0;

function parseDurationValue(raw) {
  if (!raw) return null;
  var s = String(raw).trim();
  var m1 = s.match(/^(\d+)\s*(?:-|bis)\s*(\d+)$/i);
  if (m1) return Number(m1[2]);
  var m2 = s.match(/^(\d+)\s*\+$/);
  if (m2) return Number(m2[1]);
  var m3 = s.match(/^(\d+)$/);
  if (m3) return Number(m3[1]);
  return null;
}

function wheelSelectHtml(id, value, options, formatFn) {
  var opts = '<option value="0"' + (value === 0 ? ' selected' : '') + '>\u2013</option>';
  options.forEach(function (v) {
    opts += '<option value="' + v + '"' + (value === v ? ' selected' : '') + '>' + (formatFn ? formatFn(v) : v) + '</option>';
  });
  return '<select class="sr-wheel sr-mono" id="' + id + '">' + opts + '</select>';
}
function range(from, to, step) {
  var arr = [];
  for (var v = from; v <= to; v += step) arr.push(Math.round(v * 100) / 100);
  return arr;
}

function mountTodayScreen(container) {
  var pool = games.filter(function (g) {
    if (g.status === 'wunschliste') return false;
    var min = Number(g.minPlayers) || 1, max = Number(g.maxPlayers) || 99;
    var matchesPlayers = todayPlayers === 0 || (todayPlayers === 13 ? max >= 13 : (todayPlayers >= min && todayPlayers <= max));
    var avg = avgRating(g.ratings);
    var matchesRating = todayMinRating === 0 || (avg != null && avg >= todayMinRating);
    var matchesOptimal = !todayOnlyOptimal || todayPlayers === 0 || todayPlayers === 13 || Number(g.optimalPlayers) === todayPlayers;
    var matchesYear = todayYearFrom === 0 || (Number(g.year) && Number(g.year) >= todayYearFrom);
    var dur = parseDurationValue(g.duration);
    var matchesDuration = todayMaxDuration === 0 || (dur != null && dur <= todayMaxDuration);
    var matchesAge = todayAgeFrom === 0 || (Number(g.age) && Number(g.age) >= todayAgeFrom);
    return matchesPlayers && matchesRating && matchesOptimal && matchesYear && matchesDuration && matchesAge;
  });

  var activeExtra = todayOnlyOptimal || todayYearFrom > 0 || todayMaxDuration > 0 || todayAgeFrom > 0;

  container.innerHTML =
    '<div class="sr-screen">' +
      '<div class="sr-topbar"><span class="sr-display sr-topbar-title">Heute spielen</span></div>' +
      '<div class="sr-scroll sr-today">' +
        '<div class="sr-row-2">' +
          '<div><label class="sr-label">Spieler</label>' + wheelSelectHtml('todaySelPlayers', todayPlayers, range(1, 12, 1).concat([13]), function (v) { return v === 13 ? '13+' : v; }) + '</div>' +
          '<div><label class="sr-label">Mindestbewertung</label>' + wheelSelectHtml('todaySelRating', todayMinRating, range(1, 10, 1)) + '</div>' +
        '</div>' +

        '<button type="button" class="sr-expandBar' + (activeExtra ? ' active' : '') + '" id="todayFiltersToggle">Weitere Filter' + iconSvg(todayFiltersOpen ? 'chevronUp' : 'chevronDown', 16) + '</button>' +

        (todayFiltersOpen ?
          '<div class="sr-extraFilters">' +
            '<div class="sr-row-2">' +
              '<div><label class="sr-label">Jahr ab</label>' + wheelSelectHtml('todaySelYear', todayYearFrom, range(1970, 2040, 5)) + '</div>' +
              '<div><label class="sr-label">max. Dauer</label>' + wheelSelectHtml('todaySelDur', todayMaxDuration, range(10, 300, 10), function (v) { return v + ' min'; }) + '</div>' +
            '</div>' +
            '<div class="sr-row-2">' +
              '<div><label class="sr-label">Alter ab</label>' + wheelSelectHtml('todaySelAge', todayAgeFrom, range(4, 18, 2), function (v) { return v + '+'; }) + '</div>' +
              '<div><label class="sr-label">Nur optimale Spielerzahl</label><div class="sr-segmented sr-segmented-sm"><button type="button" class="sr-seg-btn' + (!todayOnlyOptimal ? ' active' : '') + '" id="optimalOff">Aus</button><button type="button" class="sr-seg-btn' + (todayOnlyOptimal ? ' active' : '') + '" id="optimalOn">An</button></div></div>' +
            '</div>' +
          '</div>' : '') +

        '<p class="sr-empty-hint" style="margin-top:14px">' + pool.length + (pool.length === 1 ? ' passendes Spiel' : ' passende Spiele') + '</p>' +
        '<button class="sr-diceBtn' + (todayPicked ? ' sr-diceBtn-sm' : '') + '" id="todayRoll" ' + (pool.length === 0 ? 'disabled' : '') + '>' + iconSvg('dices', todayPicked ? 18 : 26) + '<span>W\u00fcrfeln</span></button>' +
        (pool.length === 0 && games.length > 0 ? '<p class="sr-error">Kein Spiel im Regal passt zu diesen Kriterien.</p>' : '') +
        (todayPicked ?
          '<div class="sr-pickedCard" id="todayPickedCard">' +
            gameCardHtml(todayPicked) +
            (todayPicked.location ? '<div class="sr-locChip" style="margin-top:10px">' + iconSvg('pin', 15) + '<span>' + escapeHtml(todayPicked.location) + '</span></div>' : '') +
            '<div class="sr-row-2" style="margin-top:14px">' +
              '<button class="sr-btn-ghost" id="todayResetBtn">' + iconSvg('x', 15) + ' Zur\u00fccksetzen</button>' +
              '<button class="sr-btn-played" id="todayPlayedBtn">' + iconSvg('check', 15) + ' Gespielt</button>' +
            '</div>' +
          '</div>' : '') +
      '</div>' +
    '</div>';

  container.querySelector('#todaySelPlayers').addEventListener('change', function (e) { todayPlayers = Number(e.target.value); mountTodayScreen(container); });
  container.querySelector('#todaySelRating').addEventListener('change', function (e) { todayMinRating = Number(e.target.value); mountTodayScreen(container); });

  container.querySelector('#todayFiltersToggle').addEventListener('click', function () { todayFiltersOpen = !todayFiltersOpen; mountTodayScreen(container); });

  if (todayFiltersOpen) {
    container.querySelector('#todaySelYear').addEventListener('change', function (e) { todayYearFrom = Number(e.target.value); mountTodayScreen(container); });
    container.querySelector('#todaySelDur').addEventListener('change', function (e) { todayMaxDuration = Number(e.target.value); mountTodayScreen(container); });
    container.querySelector('#todaySelAge').addEventListener('change', function (e) { todayAgeFrom = Number(e.target.value); mountTodayScreen(container); });
    container.querySelector('#optimalOff').addEventListener('click', function () { todayOnlyOptimal = false; mountTodayScreen(container); });
    container.querySelector('#optimalOn').addEventListener('click', function () { todayOnlyOptimal = true; mountTodayScreen(container); });
  }

  var rollBtn = container.querySelector('#todayRoll');
  rollBtn.addEventListener('click', function () { rollToday(container, pool); });
  if (todayPicked) {
    container.querySelector('#todayResetBtn').addEventListener('click', function () {
      todayPicked = null; todayPlayers = 0; todayMinRating = 0; todayOnlyOptimal = false;
      todayYearFrom = 0; todayMaxDuration = 0; todayAgeFrom = 0; todayFiltersOpen = false;
      mountTodayScreen(container);
    });
    container.querySelector('#todayPlayedBtn').addEventListener('click', function () {
      var updated = Object.assign({}, todayPicked, { lastPlayed: new Date().toISOString() });
      updateGameInList(updated);
      todayPicked = updated;
      mountTodayScreen(container);
    });
    var openBtn = container.querySelector('#todayPickedCard [data-open-game]');
    if (openBtn) openBtn.addEventListener('click', function () { selectedId = todayPicked.id; renderApp(); });
  }
}
function rollToday(container, pool) {
  if (pool.length === 0) return;
  todayPicked = pool[Math.floor(Math.random() * pool.length)];
  mountTodayScreen(container);
}

/* ---------- Detailansicht ---------- */

var detailEditing = false;
var detailConfirmDelete = false;
var detailAddingRating = false;

function mountDetailScreen(container) {
  var game = games.find(function (g) { return g.id === selectedId; });
  if (!game) { selectedId = null; renderApp(); return; }

  if (detailEditing) {
    container.innerHTML =
      '<div class="sr-screen">' +
        '<div class="sr-topbar"><button class="sr-iconbtn" id="editBack">' + iconSvg('chevronLeft', 20) + '</button><span class="sr-display sr-topbar-title">Bearbeiten</span><span style="width:36px"></span></div>' +
        '<div class="sr-scroll" id="editFormHost"></div>' +
      '</div>';
    container.querySelector('#editBack').addEventListener('click', function () { detailEditing = false; mountDetailScreen(container); });
    mountGameForm(container.querySelector('#editFormHost'), game, {
      onCancel: function () { detailEditing = false; mountDetailScreen(container); },
      saveLabel: 'Änderungen speichern',
      onSave: function (updated) { updateGameInList(updated); detailEditing = false; mountDetailScreen(container); },
    });
    return;
  }

  var avg = avgRating(game.ratings);
  var thumb = game.imageUrl ? '<img src="' + escapeHtml(game.imageUrl) + '" alt="" />' : iconSvg('book', 40);

  // Sechseck: IMMER die eigene Bewertung (leer mit Plus, falls keine vorhanden) -- BGG ist ein separates Feld
  var hexInner = (avg != null)
    ? hexBadgeHtml(avg, 'sr-hex-lg', 'detailHexBtn')
    : hexEmptyHtml('sr-hex-lg', 'detailHexBtn');

  var bggChip = (game.bggRating != null)
    ? '<div class="sr-bggField"><span class="sr-bggWatermark">B</span><span class="sr-bggValue sr-mono">' + game.bggRating.toFixed(1) + '</span></div>'
    : '';

  var longestCat = CATEGORIES.reduce(function (a, b) { return b.length > a.length ? b : a; }, '');
  var ageChip = game.age ? '<div class="sr-agechip sr-agechip-lg sr-mono">' + escapeHtml(game.age) + '+</div>' : '';

  var metaRows = '';
  if (game.minPlayers || game.maxPlayers) metaRows += '<div class="sr-metaItem">' + iconSvg('users', 16) + '<span class="sr-mono">' + escapeHtml(game.minPlayers) + '\u2013' + escapeHtml(game.maxPlayers) + ' Spieler</span></div>';
  if (game.optimalPlayers) metaRows += '<div class="sr-metaItem">' + iconSvg('target', 16) + '<span class="sr-mono">optimal: ' + escapeHtml(game.optimalPlayers) + ' Spieler</span></div>';
  if (game.duration) metaRows += '<div class="sr-metaItem">' + iconSvg('clock', 16) + '<span class="sr-mono">' + escapeHtml(game.duration) + ' Min.</span></div>';
  if (game.year) metaRows += '<div class="sr-metaItem">' + iconSvg('calendar', 16) + '<span class="sr-mono">' + escapeHtml(game.year) + '</span></div>';
  if (game.publisher) metaRows += '<div class="sr-metaItem">' + iconSvg('building', 16) + '<span>' + escapeHtml(game.publisher) + '</span></div>';

  var locChip = game.location ? '<div class="sr-locChip">' + iconSvg('pin', 15) + '<span>' + escapeHtml(game.location) + '</span></div>' : '';

  var descSection = '';
  if (game.description) {
    descSection = '<div class="sr-section"><div class="sr-sectionTitle">' + iconSvg('book', 15) + ' Beschreibung</div>' +
      '<p class="sr-notes sr-clamp" id="descText">' + escapeHtml(game.description) + '</p>' +
      '<button class="sr-linkbtn" id="descToggle" style="display:none">mehr \u2026</button></div>';
  }
  var notesSection = '';
  if (game.rulesNotes) {
    notesSection = '<div class="sr-section"><div class="sr-sectionTitle">' + iconSvg('book', 15) + ' Regel-Notizen</div>' +
      '<p class="sr-notes sr-clamp" id="notesText">' + escapeHtml(game.rulesNotes) + '</p>' +
      '<button class="sr-linkbtn" id="notesToggle" style="display:none">mehr \u2026</button></div>';
  }
  var expansionsSection = '';
  if (game.expansions && game.expansions.length > 0) {
    expansionsSection = '<div class="sr-section"><div class="sr-sectionTitle">' + iconSvg('layers', 15) + ' Erweiterungen</div><div class="sr-chiprow">' +
      game.expansions.map(function (e) { return '<span class="sr-tagchip">' + escapeHtml(e) + '</span>'; }).join('') + '</div></div>';
  }
  var ratingsSection = '<div class="sr-section"><div class="sr-sectionTitle">' + iconSvg('star', 15) + ' Bewertungen</div>';
  if (game.ratings && game.ratings.length > 0) {
    ratingsSection += '<div class="sr-ratinglist">' + game.ratings.map(function (r) {
      return '<div class="sr-ratingrow static"><span>' + escapeHtml(r.name) + '</span><span class="sr-mono">' + r.score + '/10</span></div>';
    }).join('') + '<div class="sr-ratingavg sr-mono">\u00d8 ' + avg.toFixed(1) + '</div></div>';
  } else ratingsSection += '<p class="sr-empty-hint">Noch keine Bewertungen. Sechseck oben antippen zum Hinzuf\u00fcgen.</p>';
  ratingsSection += '</div>';

  var authorSection = '';
  if (game.author || game.illustrator) {
    authorSection = '<div class="sr-section"><div class="sr-sectionTitle"><img src="' + ICON_AUTHOR_HEADER + '" width="18" height="18" alt="" /> Autor & Illustrator</div>';
    if (game.author) authorSection += '<div class="sr-metaItem">' + iconSvg('pencil', 15) + '<span>Autor: ' + escapeHtml(game.author) + '</span></div>';
    if (game.illustrator) authorSection += '<div class="sr-metaItem">' + iconSvg('pencil', 15, 'sr-icon-gold') + '<span>Illustration: ' + escapeHtml(game.illustrator) + '</span></div>';
    authorSection += '</div>';
  }

  var memberRegale = (game.lists || []).map(function (id) { return shelves.find(function (s) { return s.id === id; }); }).filter(Boolean);
  var listsSection = '';
  if (game.favorite || memberRegale.length > 0) {
    listsSection = '<div class="sr-section"><div class="sr-sectionTitle">' + iconSvg('emptyShelf', 15) + ' In diesen Fächern</div>';
    if (game.favorite) {
      listsSection += '<div class="sr-regalRow highlight" data-goto-regal="favoriten">' + iconSvg('star', 16) + '<div class="sr-regalRowText"><strong>Lieblingsspiele</strong></div>' + iconSvg('chevronRight', 15) + '</div>';
    }
    memberRegale.forEach(function (s) {
      listsSection += '<div class="sr-regalRow" data-goto-regal="' + s.id + '">' + iconSvg('emptyShelf', 16) + '<div class="sr-regalRowText"><strong>' + escapeHtml(s.name) + '</strong></div>' + iconSvg('chevronRight', 15) + '</div>';
    });
    listsSection += '</div>';
  }

  var addRatingPanel = detailAddingRating ?
    '<div class="sr-addRatingPanel">' +
      '<label class="sr-label">Name</label>' +
      '<input class="sr-input" id="newRatingName" placeholder="Vorname" />' +
      '<label class="sr-label">Punktzahl (1\u201310)</label>' +
      '<input class="sr-input" id="newRatingScore" inputmode="numeric" placeholder="1\u201310" />' +
      '<div class="sr-formactions">' +
        '<button class="sr-btn-ghost" id="newRatingCancel">' + iconSvg('x', 16) + ' Abbrechen</button>' +
        '<button class="sr-btn-primary" id="newRatingSave">' + iconSvg('check', 16) + ' \u00dcbernehmen</button>' +
      '</div>' +
    '</div>' : '';

  container.innerHTML =
    '<div class="sr-screen">' +
      '<div class="sr-topbar"><button class="sr-iconbtn" id="detailBack">' + iconSvg('chevronLeft', 20) + '</button><span style="width:36px"></span><span style="width:36px"></span></div>' +
      '<div class="sr-scroll sr-detail">' +
        '<div class="sr-detail-hero">' +
          '<div class="sr-detail-thumb">' + thumb + '</div>' +
          '<div class="sr-detail-heroSide">' + hexInner + bggChip + '</div>' +
        '</div>' +
        addRatingPanel +
        '<div class="sr-detail-titlerow"><h1 class="sr-display sr-detail-title">' + escapeHtml(game.title) + '</h1>' + ageChip + '</div>' +
        '<div class="sr-catchip-fixed" style="background:' + (CATEGORY_COLORS[game.category] || CATEGORY_COLORS['Sonstiges']) + ';min-width:' + (longestCat.length * 7 + 28) + 'px">' + escapeHtml(game.category) + '</div>' +
        '<div class="sr-metaGrid">' + metaRows + '</div>' +
        locChip +
        descSection + notesSection + expansionsSection + ratingsSection + authorSection + listsSection +
        '<div class="sr-detailactions" id="detailActions">' +
          '<button class="sr-btn-ghost" id="detailEdit">' + iconSvg('pencil', 16) + ' Bearbeiten</button>' +
          (detailConfirmDelete
            ? '<div class="sr-confirmRow"><span>Wirklich l\u00f6schen?</span><button class="sr-btn-danger" id="detailDeleteYes">Ja</button><button class="sr-btn-ghost" id="detailDeleteNo">Nein</button></div>'
            : '<button class="sr-btn-danger" id="detailDeleteAsk">' + iconSvg('trash', 16) + ' L\u00f6schen</button>') +
        '</div>' +
      '</div>' +
    '</div>';

  container.querySelector('#detailBack').addEventListener('click', function () { selectedId = null; detailEditing = false; detailConfirmDelete = false; detailAddingRating = false; renderApp(); });
  Array.from(container.querySelectorAll('[data-goto-regal]')).forEach(function (row) {
    row.addEventListener('click', function () {
      var fromGameId = selectedId;
      selectedId = null;
      regalView = { mode: 'detail', id: row.getAttribute('data-goto-regal'), returnTo: { type: 'game', id: fromGameId } };
      renderApp();
    });
  });
  container.querySelector('#detailEdit').addEventListener('click', function () { detailEditing = true; mountDetailScreen(container); });
  if (detailConfirmDelete) {
    container.querySelector('#detailDeleteYes').addEventListener('click', function () { deleteGameFromList(game.id); selectedId = null; detailConfirmDelete = false; renderApp(); });
    container.querySelector('#detailDeleteNo').addEventListener('click', function () { detailConfirmDelete = false; mountDetailScreen(container); });
  } else {
    container.querySelector('#detailDeleteAsk').addEventListener('click', function () { detailConfirmDelete = true; mountDetailScreen(container); });
  }

  var hexBtn = container.querySelector('#detailHexBtn');
  if (hexBtn) hexBtn.addEventListener('click', function (e) { e.stopPropagation(); detailAddingRating = !detailAddingRating; mountDetailScreen(container); });
  if (detailAddingRating) {
    container.querySelector('#newRatingCancel').addEventListener('click', function () { detailAddingRating = false; mountDetailScreen(container); });
    container.querySelector('#newRatingScore').addEventListener('input', function (e) { e.target.value = e.target.value.replace(/\D/g, ''); });
    container.querySelector('#newRatingSave').addEventListener('click', function () {
      var name = container.querySelector('#newRatingName').value.trim();
      var score = Number(container.querySelector('#newRatingScore').value);
      if (!name || !score || score < 1 || score > 10) return;
      var ratings = game.ratings.filter(function (r) { return r.name.toLowerCase() !== name.toLowerCase(); });
      ratings.push({ name: name, score: score });
      var updated = Object.assign({}, game, { ratings: ratings });
      updateGameInList(updated);
      detailAddingRating = false;
      mountDetailScreen(container);
    });
  }

  // "weiter ..." nur einblenden, wenn Text tatsaechlich abgeschnitten ist
  ['desc', 'notes'].forEach(function (key) {
    var textEl = container.querySelector('#' + key + 'Text');
    var toggleEl = container.querySelector('#' + key + 'Toggle');
    if (!textEl || !toggleEl) return;
    if (textEl.scrollHeight > textEl.clientHeight + 1) {
      toggleEl.style.display = 'inline-block';
      toggleEl.addEventListener('click', function () {
        textEl.classList.toggle('sr-clamp-expanded');
        toggleEl.textContent = textEl.classList.contains('sr-clamp-expanded') ? 'weniger' : 'mehr \u2026';
      });
    }
  });
}

/* ---------- App-Shell ---------- */

function renderApp() {
  var r = root();
  var screenHtml = '<div class="sr-screen-host" id="screenHost"></div>';
  var tabbarHtml = '';
  if (!selectedId && !regalView && !settingsView) {
    tabbarHtml =
      '<div class="sr-tabbar">' +
        '<button class="sr-tabbtn' + (tab === 'shelf' ? ' active' : '') + '" data-set-tab="shelf">' + iconSvg('grid', 20) + ' Regal</button>' +
        '<button class="sr-tabbtn' + (tab === 'add' ? ' active' : '') + '" data-set-tab="add">' + iconSvg('plus', 20) + ' Hinzuf\u00fcgen</button>' +
        '<button class="sr-tabbtn' + (tab === 'today' ? ' active' : '') + '" data-set-tab="today">' + iconSvg('dices', 20) + ' Heute</button>' +
      '</div>';
  }

  r.innerHTML =
    '<div class="sr-app"><div class="sr-phone"><div class="sr-island"></div>' + screenHtml + tabbarHtml + '</div></div>';

  var host = document.getElementById('screenHost');
  host.style.display = 'flex';
  host.style.flexDirection = 'column';
  host.style.flex = '1';
  host.style.minHeight = '0';

  if (!loaded) {
    host.innerHTML = '<div class="sr-screen" style="align-items:center;justify-content:center">' + iconSvg('loader', 28, 'sr-spin') + '</div>';
  } else if (selectedId) {
    detailEditing = false; detailConfirmDelete = false; detailAddingRating = false;
    mountDetailScreen(host);
  } else if (settingsView) {
    mountSettingsScreen(host);
  } else if (regalView && regalView.mode === 'manage') {
    mountRegalManageScreen(host);
  } else if (regalView && regalView.mode === 'detail') {
    mountRegalDetailScreen(host, regalView.id);
  } else if (regalView && regalView.mode === 'select') {
    mountRegalSelectScreen(host, regalView.id);
  } else if (tab === 'shelf') {
    mountShelfScreen(host);
  } else if (tab === 'add') {
    mountAddScreen(host);
  } else {
    mountTodayScreen(host);
  }

  var tabbar = document.querySelector('.sr-tabbar');
  if (tabbar) {
    tabbar.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-set-tab]');
      if (!btn) return;
      tab = btn.getAttribute('data-set-tab');
      renderApp();
    });
  }
}

loadGames();
loadShelves();
renderApp();
</script>
</body></html>
